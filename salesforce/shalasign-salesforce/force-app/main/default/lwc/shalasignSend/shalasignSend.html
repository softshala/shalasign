<template>
    <lightning-quick-action-panel header="Send with ShalaSign">
        <template lwc:if={error}><div class="slds-text-color_error slds-m-bottom_small">{error}</div></template>
        <template lwc:if={loading}><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></template>
        <lightning-combobox label="Template" value={templateId} options={templateOptions} onchange={handleTemplate} placeholder="Choose a ShalaSign template"></lightning-combobox>
        <template lwc:if={template}>
            <lightning-input label="Document title" value={title} onchange={handleTitle} class="slds-m-top_small"></lightning-input>
            <h3 class="slds-text-heading_small slds-m-top_medium">Signers</h3>
            <template for:each={signerRows} for:item="row">
                <div key={row.index} class="slds-box slds-box_x-small slds-m-top_x-small">
                    <div class="slds-text-title">{row.role}</div>
                    <lightning-combobox label="Pick a contact" value={row.pick} options={contactOptions} data-index={row.index} onchange={handlePick}></lightning-combobox>
                    <lightning-layout>
                        <lightning-layout-item size="6" padding="horizontal-small"><lightning-input label="Name" value={row.name} data-index={row.index} data-field="name" onchange={handleSigner}></lightning-input></lightning-layout-item>
                        <lightning-layout-item size="6" padding="horizontal-small"><lightning-input type="email" label="Email" value={row.email} data-index={row.index} data-field="email" onchange={handleSigner}></lightning-input></lightning-layout-item>
                    </lightning-layout>
                </div>
            </template>
            <template lwc:if={hasMerge}>
                <h3 class="slds-text-heading_small slds-m-top_medium">Merge fields</h3>
                <template for:each={mergeRows} for:item="m">
                    <lightning-input key={m.key} label={m.label} value={m.value} data-key={m.key} onchange={handleMerge}></lightning-input>
                </template>
            </template>
            <lightning-textarea label="Message to signers (optional)" value={message} onchange={handleMessage} class="slds-m-top_small"></lightning-textarea>
        </template>
        <div slot="footer">
            <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
            <lightning-button label="Send for signature" variant="brand" onclick={handleSend} disabled={cannotSend}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
