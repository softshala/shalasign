<template>
    <lightning-card title="ShalaSign envelopes" icon-name="custom:custom51">
        <lightning-button slot="actions" label="Refresh" icon-name="utility:refresh" onclick={load}></lightning-button>
        <div class="slds-p-horizontal_medium">
            <template lwc:if={error}><div class="slds-text-color_error">{error}</div></template>
            <template lwc:if={empty}><p class="slds-text-color_weak">No documents sent from this record yet. Use <b>Send with ShalaSign</b>.</p></template>
            <template for:each={rows} for:item="r">
                <div key={r.Id} class="slds-grid slds-wrap slds-border_bottom slds-p-vertical_x-small">
                    <div class="slds-col slds-size_7-of-12">
                        <div><b>{r.Name}</b> <span class={r.badgeClass}>{r.statusLabel}</span></div>
                        <div class="slds-text-color_weak slds-text-body_small">{r.Signer_Summary__c} {r.when}</div>
                        <template lwc:if={r.Error__c}><div class="slds-text-color_error slds-text-body_small">{r.Error__c}</div></template>
                    </div>
                    <div class="slds-col slds-size_5-of-12 slds-text-align_right">
                        <template lwc:if={r.isSent}>
                            <lightning-button-icon icon-name="utility:notification" alternative-text="Remind" title="Send reminder" data-id={r.Id} onclick={handleRemind}></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:ban" alternative-text="Void" title="Void" data-id={r.Id} onclick={handleVoid} class="slds-m-left_xx-small"></lightning-button-icon>
                        </template>
                        <template lwc:if={r.fileUrl}><lightning-button label="Signed PDF" icon-name="utility:file" data-url={r.fileUrl} onclick={handleOpen} class="slds-m-left_xx-small"></lightning-button></template>
                        <template lwc:if={r.Open_Url__c}><lightning-button-icon icon-name="utility:new_window" alternative-text="Open in ShalaSign" data-url={r.Open_Url__c} onclick={handleOpen} class="slds-m-left_xx-small"></lightning-button-icon></template>
                        <lightning-button-icon icon-name="utility:sync" alternative-text="Sync" title="Refresh status" data-id={r.Id} onclick={handleSync} class="slds-m-left_xx-small"></lightning-button-icon>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
